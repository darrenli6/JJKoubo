<!doctype html>
<!--@template-doc
  founder-interview — KB Cut cover template.

  The executable form of frame.md's `Cover Design` section. Filled by
  $kbcut/scripts/make-cover.cjs and rendered to PNG with `hyperframes snapshot`.

  This is an INDEPENDENT composition. It shares the preset's fonts, colors and
  brand constraints with template.html, but none of its layout. Never produce a
  cover by screenshotting a packaged frame — that frame carries captions,
  credentials and a topic lockup the cover must not inherit.

  Placeholder contract (see frame.md `templates.cover`):
    {{COVER_TITLE_LINES}}      3 lines, 3-4 Chinese characters each
    {{COVER_BACKGROUND_SRC}}   clean still extracted by make-cover.cjs
    {{FONT_COVER_TITLE}} {{LAYOUT_VARS}} {{COMPOSITION_*}} {{DURATION_SECONDS}}

  Composition law: bright and open. frame.md forbids a vignette, dark scrim,
  shadow mask or black block here. Focus comes from crop, spacing, title
  placement and line breaks — never from darkening the picture.
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{COMPOSITION_WIDTH}}, height={{COMPOSITION_HEIGHT}}" />
    <title>KB Cut — founder-interview cover</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "FounderCoverTitle";
        src: url("fonts/{{FONT_COVER_TITLE}}");
        font-weight: 400;
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #000000;
      }

      #root {
        {{LAYOUT_VARS}}

        position: relative;
        width: {{COMPOSITION_WIDTH}}px;
        height: {{COMPOSITION_HEIGHT}}px;
        overflow: hidden;
        container-type: size;
        font-family: "FounderCoverTitle", sans-serif;
        letter-spacing: 0;
      }

      #stage-ground {
        position: absolute;
        inset: 0;
        background: #000000;
        z-index: 0;
      }

      /*
        Only positioning is declared here; the framework owns .clip visibility.
        Unlike the packaging template these clips are not full-bleed, so each
        one sets its own box below.
      */
      .clip {
        position: absolute;
      }

      /*
        The cover keeps its own crop anchor. frame.md allows the cover to be
        framed differently from the packaged video, so --cover-anchor-y is
        independent of the packaging crop plan.
      */
      #cover-background {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--cover-anchor-x) var(--cover-anchor-y);
        transform: scale(var(--cover-scale));
        transform-origin: var(--cover-anchor-x) var(--cover-anchor-y);
        z-index: 1;
      }

      #cover-title {
        position: absolute;
        left: var(--safe-x);
        top: var(--title-block-top);
        z-index: 100;
        max-width: var(--title-max-width);
      }

      .cover-title-line {
        font-size: var(--title-size);
        font-weight: 400;
        color: var(--title-color);
        line-height: var(--title-line-height);
        margin-bottom: var(--title-line-gap);
      }

      .cover-title-line:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="{{COMPOSITION_ID}}"
      data-start="0"
      data-width="{{COMPOSITION_WIDTH}}"
      data-height="{{COMPOSITION_HEIGHT}}"
      data-duration="{{DURATION_SECONDS}}"
    >
      <div id="stage-ground"></div>

      <img
        id="cover-background"
        class="clip"
        src="{{COVER_BACKGROUND_SRC}}"
        data-start="0"
        data-duration="{{DURATION_SECONDS}}"
        data-track-index="0"
        alt=""
      />

      <div
        id="cover-title"
        class="clip"
        data-start="0"
        data-duration="{{DURATION_SECONDS}}"
        data-track-index="1"
      >
        {{COVER_TITLE_LINES}}
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // The cover is a still. HyperFrames still requires exactly one paused
      // timeline per composition, so hold an inert one for the full duration.
      const tl = gsap.timeline({ paused: true });
      tl.to({ hold: 0 }, { hold: 1, duration: {{DURATION_SECONDS}} }, 0);
      window.__timelines["{{COMPOSITION_ID}}"] = tl;
    </script>
  </body>
</html>
